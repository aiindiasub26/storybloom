<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="StoryBloom flower">
<!-- StoryBloom bloom: the stem grows, two leaves unfurl, the petals open, then the flower sways.
     Every element's resting style is the finished flower, so reduced-motion users see it fully open. -->
<defs>
  <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
  <radialGradient id="petal" cx="100" cy="84" r="52" gradientUnits="userSpaceOnUse"><stop offset="0.25" stop-color="#ffe98f"/><stop offset="1" stop-color="#f7c63a"/></radialGradient>
  <radialGradient id="petalb" cx="100" cy="84" r="56" gradientUnits="userSpaceOnUse"><stop offset="0.3" stop-color="#f9c94a"/><stop offset="1" stop-color="#ef9f2c"/></radialGradient>
  <radialGradient id="mid" cx="96" cy="80" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbb15e"/><stop offset="1" stop-color="#e9802b"/></radialGradient>
</defs>
<style>
  .ink { stroke: #2f2a3b; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .stem { fill: none; stroke: #5fae72; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: grow .55s cubic-bezier(.3,.7,.4,1) both; }
  .stem-ink { fill: none; stroke: #2f2a3b; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1; animation: grow .55s cubic-bezier(.3,.7,.4,1) both; }
  .leaf { fill: #7cc28a; transform-origin: var(--o); animation: unfurl .4s cubic-bezier(.34,1.56,.64,1) both; }
  .leaf-vein { fill: none; stroke: #4f9a62; stroke-width: 1.6; stroke-linecap: round; }
  .bud { fill: #7cc28a; transform-origin: 100px 84px; animation: pop .3s .32s cubic-bezier(.34,1.56,.64,1) both; }
  .pb { fill: url(#petalb); transform-origin: 100px 84px; animation: open .5s cubic-bezier(.34,1.5,.64,1) both; }
  .pf { transform-origin: 100px 84px; animation: open .5s cubic-bezier(.34,1.6,.64,1) both; }
  .pf path:first-child { fill: url(#petal); }
  .vein { fill: none; stroke: #e0a92a; stroke-width: 1.4; stroke-linecap: round; opacity: .7; }
  .mid { transform-origin: 100px 84px; animation: pop .42s 1.02s cubic-bezier(.34,1.8,.64,1) both; }
  .head { transform-origin: 100px 190px; animation: sway 4.2s 1.5s ease-in-out infinite alternate; }
  .shadow { fill: #2f2a3b; opacity: .12; transform-origin: 100px 194px; animation: pop .5s both; }
  .spark { fill: #f6a04d; animation: twinkle 2.4s ease-in-out infinite both; }
  @keyframes grow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes unfurl { from { transform: scale(0) rotate(-25deg); } to { transform: scale(1) rotate(0); } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes open { from { transform: scale(.05) rotate(-22deg); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes twinkle { 0%, 55% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .spark { opacity: 0; } }
</style>
<ellipse class="shadow" cx="100" cy="194" rx="30" ry="4"/>
<g filter="url(#pencil)">
  <g class="head">
    <path class="stem-ink" pathLength="1" d="M100 192 C 95 166, 107 128, 100 90"/>
    <path class="stem" pathLength="1" d="M100 192 C 95 166, 107 128, 100 90"/>
    <g class="leaf" style="--o:99px 172px;animation-delay:.3s"><path class="ink" fill="#7cc28a" d="M99 172 C 80 169, 66 156, 61 141 C 80 140, 95 153, 99 172 Z"/><path class="leaf-vein" d="M96 168 C 86 160, 76 152, 66 144"/></g>
    <g class="leaf" style="--o:102px 152px;animation-delay:.4s"><path class="ink" fill="#7cc28a" d="M102 152 C 118 145, 132 134, 138 120 C 120 122, 106 134, 102 152 Z"/><path class="leaf-vein" d="M105 148 C 113 140, 123 131, 133 124"/></g>
    <circle class="bud ink" cx="100" cy="84" r="14"/>
    <g class="ink"><g transform="rotate(18 100 84)"><path class="pb" style="animation-delay:0.420s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(198 100 84)"><path class="pb" style="animation-delay:0.446s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(90 100 84)"><path class="pb" style="animation-delay:0.472s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(270 100 84)"><path class="pb" style="animation-delay:0.498s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(162 100 84)"><path class="pb" style="animation-delay:0.524s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(342 100 84)"><path class="pb" style="animation-delay:0.550s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(54 100 84)"><path class="pb" style="animation-delay:0.576s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(234 100 84)"><path class="pb" style="animation-delay:0.602s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(126 100 84)"><path class="pb" style="animation-delay:0.628s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g><g transform="rotate(306 100 84)"><path class="pb" style="animation-delay:0.654s" d="M100 84 C 81 68, 82 37, 100 29 C 118 37, 119 68, 100 84 Z"/></g></g>
    <g class="ink"><g transform="rotate(0 100 84)"><g class="pf" style="animation-delay:0.560s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(180 100 84)"><g class="pf" style="animation-delay:0.590s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(72 100 84)"><g class="pf" style="animation-delay:0.620s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(252 100 84)"><g class="pf" style="animation-delay:0.650s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(144 100 84)"><g class="pf" style="animation-delay:0.680s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(324 100 84)"><g class="pf" style="animation-delay:0.710s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(36 100 84)"><g class="pf" style="animation-delay:0.740s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(216 100 84)"><g class="pf" style="animation-delay:0.770s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(108 100 84)"><g class="pf" style="animation-delay:0.800s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g><g transform="rotate(288 100 84)"><g class="pf" style="animation-delay:0.830s"><path d="M100 84 C 84 70, 85 43, 100 35 C 115 43, 116 70, 100 84 Z"/><path class="vein" d="M100 78 L100 46"/></g></g></g>
    <g class="mid">
      <circle class="ink" cx="100" cy="84" r="18" fill="url(#mid)"/>
      <g fill="#8a4b1c" opacity=".5"><circle cx="93" cy="80" r="1.8"/><circle cx="101" cy="76" r="1.8"/><circle cx="108" cy="82" r="1.8"/><circle cx="96" cy="89" r="1.8"/><circle cx="105" cy="90" r="1.8"/><circle cx="100" cy="84" r="1.8"/><circle cx="91" cy="87" r="1.5"/><circle cx="109" cy="88" r="1.5"/></g>
      <path d="M91 78 C 93 74, 97 72, 100 72" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
    </g>
  </g>
</g>
<g class="spark" style="animation-delay:1.4s;transform-origin:44px 48px"><path transform="translate(44 48)" d="M0 -7 C 1 -2, 2 -1, 7 0 C 2 1, 1 2, 0 7 C -1 2, -2 1, -7 0 C -2 -1, -1 -2, 0 -7 Z"/></g>
<g class="spark" style="animation-delay:1.9s;transform-origin:158px 38px;fill:#f29bb8"><path transform="translate(158 38)" d="M0 -7 C 1 -2, 2 -1, 7 0 C 2 1, 1 2, 0 7 C -1 2, -2 1, -7 0 C -2 -1, -1 -2, 0 -7 Z"/></g>
<g class="spark" style="animation-delay:2.5s;transform-origin:164px 122px;fill:#4fb7b3"><path transform="translate(164 122) scale(.8)" d="M0 -7 C 1 -2, 2 -1, 7 0 C 2 1, 1 2, 0 7 C -1 2, -2 1, -7 0 C -2 -1, -1 -2, 0 -7 Z"/></g>
</svg>
